apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
spec:
  serviceName: {{ include "mongodb.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mongodb.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mongodb.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          args:
            - "--replSet=rs0"
            - "--bind_ip=0.0.0.0"
            - "--keyFile=/etc/mongo-keyfile/key"
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  mongo --quiet --eval 'db.runCommand({ ping: 1 })'
            initialDelaySeconds: 10
            periodSeconds: 5
      initContainers:
        - name: init-config
          image: mongo:6.0
          command:
            - /bin/sh
            - -c
            - |
              if [ "$(hostname)" = "{{ include "mongodb.fullname" . }}-0" ]; then
                mongo --host {{ include "mongodb.fullname" . }}-0.{{ include "mongodb.fullname" . }} --quiet --eval '
                  rs.initiate({_id:"rs0", members:[{_id:0, host:"{{ include "mongodb.fullname" . }}-0.{{ include "mongodb.fullname" . }}:27017"}]});
                '
              fi
          volumeMounts:
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
      volumes:
        - name: keyfile
          secret:
            secretName: {{ .Values.init.keyFileSecret }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 8 }}
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
