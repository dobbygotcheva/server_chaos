apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  api.json: |
    {
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "graph",
          "title": "API Latency",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "title": "API Overview"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring.fullname" . }}-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: grafana
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: /var/lib/grafana/dashboards
              name: dashboards
      volumes:
        - name: dashboards
          configMap:
            name: grafana-dashboards
