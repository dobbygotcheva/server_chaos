apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-api
  labels:
    app: cloud-native-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-native-api
  template:
    metadata:
      labels:
        app: cloud-native-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/cloud-native-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: uri
            - name: APP_VERSION
              value: "0.1.0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-native-api
spec:
  selector:
    app: cloud-native-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
